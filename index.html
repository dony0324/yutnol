        .runner-chips { display: flex; flex-wrap: wrap; gap: 4px; }

        .runner-chip.empty { background: transparent; border: 1px solid #475569; color: #94a3b8; }

        .nav-btn.action-btn { color: #f87171; }
        .nav-btn.action-btn:active { background: rgba(239, 68, 68, 0.1); }

        .content-region { display: none; padding: 1rem; max-width: 600px; margin: 0 auto; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .board-card { border-radius: 16px; padding: 1rem; margin-bottom: 1rem; position: relative; }
        #board-container { position: relative; width: 100%; aspect-ratio: 1/1; }
        canvas { width: 100%; height: 100%; }
